<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>St. Paul’s Coptic School at Kisumu – Admissions 2027</title>
<style>
:root{--navy:#0b2545;--gold:#d9a521;--bg:#fff9ec;--card:#fff;--ink:#1d2433;--line:#e4dcc6;--mute:#5b6070;--ok:#1f8a4c;--bad:#b00020;--soft:#fffaf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141f;--card:#192033;--ink:#eef0f6;--line:#2c3550;--mute:#a7adc0;--soft:#1f2740;--navy:#e8c46a;--ok:#5fd38d;--bad:#ff8a9b}}
:root[data-theme="dark"]{--bg:#10141f;--card:#192033;--ink:#eef0f6;--line:#2c3550;--mute:#a7adc0;--soft:#1f2740;--navy:#e8c46a;--ok:#5fd38d;--bad:#ff8a9b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#0b2545;color:#fff;text-align:center;padding:20px 14px;border-bottom:5px solid var(--gold)}
.hd{display:flex;align-items:center;justify-content:center;gap:14px;text-align:left}.hd img{width:150px;height:150px;border-radius:50%;object-fit:cover;flex:none;background:#fff;border:3px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.35)}@media(max-width:560px){.hd{flex-direction:column;text-align:center;gap:10px}.hd img{width:130px;height:130px}}
header h1{margin:0;font-size:1.5rem}header p{margin:4px 0 0;color:var(--gold);font-style:italic}
main{max-width:760px;margin:0 auto;padding:14px}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 14px}
.badges span{background:var(--card);border:1px solid var(--gold);border-radius:20px;padding:3px 12px;font-size:.85rem;font-weight:700;color:var(--navy)}
fieldset{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;padding:14px}
legend{background:var(--gold);color:#0b2545;font-weight:800;padding:2px 14px;border-radius:20px}
label{display:block;font-weight:600;font-size:.88rem;margin:10px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:560px){.g{grid-template-columns:1fr}}
.o{display:flex;gap:6px 16px;flex-wrap:wrap}.o label{display:flex;align-items:center;gap:6px;font-weight:500;margin:3px 0}.o input{width:auto}
.h{display:none!important}
.box{background:var(--soft);border:1px dashed var(--gold);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.9rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}td:last-child,th:last-child{text-align:right}
.tot td{font-weight:800;color:var(--navy);border-top:2px solid var(--navy)}
.plan{display:block;border:2px solid var(--line);border-radius:10px;padding:9px;margin:7px 0;cursor:pointer;font-weight:600}.plan input{width:auto;margin-right:6px}.plan.sel{border-color:var(--gold);background:var(--soft)}.plan small{display:block;font-weight:400;color:var(--mute)}
button,.btn{background:#0b2545;color:#fff;border:0;border-radius:10px;padding:13px;font:700 1rem inherit;width:100%;cursor:pointer;text-align:center;display:block;text-decoration:none;margin-top:8px}
button.s{width:auto;padding:7px 12px;font-size:.85rem;margin:0;display:inline-block}
button:disabled{opacity:.6}
.note{font-size:.82rem;color:var(--mute)}
.zm{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:8px}.zm img{max-width:100%;max-height:100%}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.ph figure{margin:0;text-align:center;font-size:.85rem}.ph img,.ph .e{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--mute)}
#done{background:var(--card);border:2px solid var(--ok);border-radius:14px;padding:18px;text-align:center}#done h2{color:var(--ok);margin-top:0}.ref{font-size:1.5rem;font-weight:800;color:var(--navy)}
.sc{overflow-x:auto}.sc table{min-width:620px}.sc tr.r{cursor:pointer}.sc tr.r:hover{background:var(--soft)}
.pill{padding:2px 8px;border-radius:10px;background:var(--soft);border:1px solid var(--gold);font-size:.78rem;font-weight:700}
footer{text-align:center;font-size:.78rem;color:var(--mute);padding:18px}
</style>
</head>

 const n=+sel.value, sum=terms.slice(0,n).reduce((a,b)=>a+b,0), per=n===2?DISC2:n===3?DISC3:0;
 const t1=terms[0]*(1-sib), scopeTotal=sum*(1-sib)*(1-per), plan=rv("plan");
 $("#ft").innerHTML=`<tr><th>Item</th><th>Amount</th></tr><tr><td>Tuition fees (varies by grade)</td><td>${fmt(fe[e])}</td></tr><tr><td>Other expenses levy (same for all students)</td><td>${fmt(LEVY[0])}</td></tr>`+(sib?`<tr><td>Sibling discount ${sib*100}%</td><td>−${fmt(terms[0]*sib)}</td></tr>`:"")+`<tr class="tot"><td>Term to pay</td><td>${fmt(t1)}</td></tr>`;
 $("#p1").textContent=`${fmt(scopeTotal)}`+(per?` after ${per*100}% discount`:"");
 $("#p2").textContent=`${fmt(t1/2)} + ${fmt(t1/2)}`;$("#p3").textContent=`${fmt(t1/4)} × 4`;$("#p4").textContent="Uniform price is confirmed at the school";
 document.querySelectorAll(".plan").forEach(l=>l.classList.toggle("sel",l.querySelector("input").checked));
 tog("#scopeB",plan==="1");
 let now=0,t="Choose a payment plan.";
 if(plan==="1"){now=scopeTotal;t=`Pay now: ${fmt(now)}`}
 if(plan==="2"){now=t1/2;t=`Pay now (November): ${fmt(now)}; December: ${fmt(t1/2)}`}
 if(plan==="3"){now=t1/4;t=`Pay now (November): ${fmt(now)}; then ${fmt(t1/4)} in each of December, January, February`}
 if(plan==="4"){now=1000;t="Pay the uniform in full, then KES 1,000 every month for school fees."}
 due={now,text:t};$("#due").textContent=t;
}
document.querySelectorAll('[name="plan"]').forEach(r=>r.onchange=calc);

let shotData="";
function shrink(file,mx=900,q=.6){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
$("#shot").onchange=async e=>{shotData="";const p=$("#shotP");p.classList.add("h");if(e.target.files[0]){try{shotData=await shrink(e.target.files[0]);p.src=shotData;p.classList.remove("h")}catch(_){$("#err").textContent="Could not read that image. Try another screenshot."}}};
const FILES={};
const readFile=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
async function prep(f){
 if(f.type==="application/pdf"){if(f.size>4e6)throw new Error(f.name+" is larger than 4 MB. Upload a smaller PDF or a photo.");return{name:f.name,mime:f.type,data:await readFile(f)}}
 if(f.type.startsWith("image/"))return{name:f.name,mime:"image/jpeg",data:await shrink(f,1600,.75)};
 throw new Error(f.name+": only photos or PDF files are allowed.");}
["fBirth","fPid","fPph","fSph"].forEach(id=>{$("#"+id).onchange=async e=>{FILES[id]=[];const st=$("#"+id+"S");st.textContent="Preparing…";
 try{const a=[];for(const f of e.target.files)a.push(await prep(f));FILES[id]=a;st.textContent=a.length?"✓ "+a.length+" file(s) ready":""}catch(x){e.target.value="";st.textContent=x.message}}});
function collect(){
 const d={};Object.keys(L).forEach(n=>{const els=[...f.querySelectorAll(`[name="${n}"]`)];
  d[n]=els[0]&&els[0].type==="checkbox"?els.filter(x=>x.checked).map(x=>x.value).join(", "):els[0]&&els[0].type==="radio"?rv(n):els[0]?(els[0].tagName==="SELECT"?(els[0].value?els[0].selectedOptions[0].text:""):els[0].value):"";});
 return d;}
f.onsubmit=async e=>{
 e.preventDefault();$("#err").textContent="";
 const bad=[...f.querySelectorAll("[required]")].find(x=>x.type==="checkbox"?!x.checked:!x.value.trim());
 if(bad){bad.focus();$("#err").textContent="Please complete all required (*) fields and accept the declarations.";return}
 if(val("method")==="M-Pesa"&&!shotData){$("#err").textContent="Please upload the screenshot of your M-Pesa payment.";return}
 if(+val("sibn")>0&&!val("sibs").trim()){$("#err").textContent="Please write the names of the brothers/sisters applying this year.";return}
 if(!rv("plan")){$("#err").textContent="Please choose a payment plan.";return}
 const d=collect(),ref="APP-"+new Date().toISOString().slice(2,10).replace(/-/g,"")+"-"+Math.floor(1000+Math.random()*9000);
 Object.assign(d,{uniform:"Buy from school",shot:shotData,ref,created:new Date().toISOString(),status:"Pending",admno:"",anote:"",planText:due.text,dueNow:Math.round(due.now),planNo:rv("plan")});
 $("#btn").disabled=true;$("#btn").textContent="Sending… uploading files, please wait";
 const BODY=JSON.stringify({labels:L,data:d,files:{birth:FILES.fBirth,pid:FILES.fPid,pphotos:FILES.fPph,sphotos:FILES.fSph}});
 if(BODY.length>30e6){$("#err").textContent="The files are too large (about 20 MB in total at most). Please upload smaller files.";$("#btn").disabled=false;$("#btn").textContent="Submit application";return}
 let saved=false;
 try{await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:BODY});saved=!!SCRIPT_URL}catch(_){}
 const sum=`Application ${ref}\nLearner: ${d.lname} (${d.grade})\nParent: ${d.pname} ${d.phone}\nPlan: ${d.planText}\nMethod: ${d.method}`;
 $("#done").innerHTML=`<h2>${saved?"Application received ✔":"Almost done – send it to the school"}</h2><p>Your reference:</p><div class="ref">${ref}</div><p>${due.text}</p>`+(saved?"":`<p class="note">Please send your application details to the school on WhatsApp so it reaches the office.</p>`)+`<a class="btn" href="https://wa.me/${WA}?text=${encodeURIComponent(sum)}">Send / confirm on WhatsApp</a><p class="note">The school will contact you and issue the Admission Number (PCS/27/____).</p>`;
 tog("#f",0);tog("#done",1);document.querySelector(".badges").classList.add("h");scrollTo(0,0);};
